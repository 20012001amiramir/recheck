name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: standard library only
        run: test "$(go list -m all | wc -l)" -eq 1
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet and test
        run: GO_LOCAL=1 ./build.sh test
      - name: native binary
        run: GO_LOCAL=1 ./build.sh build
      # Built in the toolchain containers the script defaults to, which is how the artifact that
      # ships is built. Installed alongside a runner's own Go instead, TinyGo 0.38.0 produced a
      # page module that panicked inside its own panic printer the moment the browser API was
      # called — a binary nobody would ever have shipped, failing a check meant to protect the one
      # we do. The runner has Docker; the four minutes it costs buy an artifact that is the
      # artifact.
      - name: wasm and npm package
        run: ./build.sh wasm
      - name: smoke (binary, npm wrapper, browser API)
        run: ./build.sh smoke
      - name: release matrix
        run: GO_LOCAL=1 ./build.sh release
