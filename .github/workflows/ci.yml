name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tinygo (builds the page's module)
        run: |
          curl -fsSL -o /tmp/tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v0.38.0/tinygo_0.38.0_amd64.deb
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version
      - name: standard library only
        run: test "$(go list -m all | wc -l)" -eq 1
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet and test
        run: GO_LOCAL=1 ./build.sh test
      - name: native binary
        run: GO_LOCAL=1 ./build.sh build
      - name: wasm and npm package
        run: GO_LOCAL=1 ./build.sh wasm
      - name: smoke (binary, npm wrapper, browser API)
        run: ./build.sh smoke
      - name: release matrix
        run: GO_LOCAL=1 ./build.sh release
